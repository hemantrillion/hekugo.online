<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f1b33"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="44" fill="url(#bgGrad)"/>
  <rect width="188" height="188" x="2" y="2" rx="42" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
  
  <!-- Orbital Caustic Ring -->
  <circle cx="96" cy="96" r="62" fill="none" stroke="url(#cyanGlow)" stroke-width="4" stroke-dasharray="14 8" opacity="0.4" filter="url(#glow)"/>
  <circle cx="96" cy="96" r="54" fill="none" stroke="url(#cyanGlow)" stroke-width="3" opacity="0.6"/>
  
  <!-- Living Water Flow Center Dot -->
  <circle cx="96" cy="42" r="5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- OQ Bold Typography -->
  <text x="96" y="112" font-family="'Cascadia Code', -apple-system, monospace" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">OQ</text>
  <text x="96" y="132" font-family="'Cascadia Code', monospace" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="4">OPERATIONS</text>
</svg>
